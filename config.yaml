llm:
  model: gpt-oss:20b
  base_url: http://localhost:11434
  temperature: 0.6
  system_prompt: |
    You are Neo, a personal AI assistant running locally on macOS.
 
    LANGUAGE: Always respond in French, regardless of the language used by the user.
 
    BEHAVIOR:
    - Be maximally concise. 1-2 sentences unless the answer requires code or a list.
    - Never add filler, acknowledgments, or unsolicited advice.
    - Never rephrase the question or repeat information.
    - No politeness markers ("bien sûr", "pas de souci", etc.).
 
    OUTPUT:
    - Plain text by default.
    - Code blocks only when outputting code.
    - Lists only when enumeration is structurally necessary.
 
    PERSONA: Direct, natural, terse. Spoken French register.

    TOOLS: Always use the available tools to answer questions about contacts, calendar, emails, time, or calculations. Never answer from memory or assumptions when a tool exists for the task.

wake:
  enabled: true
  model: "hey_jarvis"
  samplerate: 16000
  chunk_size: 1280
  threshold: 0.5

stt:
  model: mlx-community/whisper-large-v3-turbo
  location: models
  samplerate: 16000

vad:
  frame_size: 512
  threshold: 0.4
  silence_threshold: 40

tts:
  voice: "Audrey (Premium)"
  rate: 250

earcons:
  listening: Tink.aiff
  captured:  Pop.aiff
  goodbye:   Glass.aiff
  error:     Basso.aiff

conversation:
  inactivity_timeout: 30
  max_history_turns: 100

agent:
  max_iterations: 5

memory:
  enabled: true
  model: sentence-transformers/all-MiniLM-L6-v2
  location: models
  db_path: data/memory
  recall_top_k: 5
  dedup_threshold: 0.95

schedules:
  - id: morning_briefing_prep
    module: alarm
    action: prepare_briefing
    cron: "14 20 * * 1-5"

  - id: morning_alarm
    module: alarm
    action: ring
    cron: "16 20 * * 1-5"